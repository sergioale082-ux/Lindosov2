          LINDOSO_EOF
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'LINDOSO_EOF'
          <resources>
              <style name="Theme.Lindoso" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:colorAccent">#00E5C7</item>
              </style>
              <style name="Theme.Lindoso.Sheet" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:backgroundDimEnabled">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">#151515</item>
              </style>
          </resources>
