          suspend fun startDownload(url: String, title: String, whole: Boolean, height: Int?) {
              val items = if (whole) runCatching { YtRepo.playlist(YtRepo.playlistUrl(url)).map { it.url to it.title } }.getOrDefault(emptyList())
              else listOf(url to title)
              if (items.isNotEmpty()) Dl.enqueue(items, height)
          }

          @Composable
          fun FormatDialog(url: String, title: String, onDone: () -> Unit) {
