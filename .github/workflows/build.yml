          @Composable
          fun FormatPicker(title: String, hasList: Boolean, busy: Boolean, onGo: (height: Int?, whole: Boolean) -> Unit) {
              var sel by remember { mutableIntStateOf(0) }        // 0 = áudio, senão a altura do vídeo
              var more by remember { mutableStateOf(false) }
