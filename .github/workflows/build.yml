          /** WebView do YouTube mantido vivo entre as abas (não recarrega ao trocar de aba). */
          object Web {
              var view: WebView? = null
              fun get(c: Context, onUrl: (String) -> Unit): WebView {
                  val w = view ?: WebView(c).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      setBackgroundColor(android.graphics.Color.BLACK)
                      loadUrl("https://m.youtube.com")
                  }.also { view = it }
                  (w.parent as? ViewGroup)?.removeView(w)
                  w.webViewClient = object : WebViewClient() {
                      override fun doUpdateVisitedHistory(v: WebView, url: String, isReload: Boolean) { onUrl(url) }
                      override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest) = r.url.scheme?.startsWith("http") != true
                  }
                  return w
              }
          }

