          // ───────────────────────── Pesquisar ─────────────────────────
          private val TOPICS = listOf(
              "🎵 Músicas livres" to "música sem direitos autorais",
              "📜 Creative Commons" to "creative commons",
              "🎬 Trilhas p/ vídeos" to "trilha sonora livre para vídeos",
              "🎙️ Podcasts" to "podcast",
              "📚 Aulas e tutoriais" to "aula tutorial",
              "🌿 Relaxamento" to "música relaxante sem copyright"
          )

          @Composable
          fun SearchTab() {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              val prefs = remember { ctx.getSharedPreferences("p", Context.MODE_PRIVATE) }
              var q by remember { mutableStateOf("") }
              var link by remember { mutableStateOf("") }
              var clip by remember { mutableStateOf<String?>(null) }
              var linkUrl by remember { mutableStateOf<String?>(null) }
              var sugg by remember { mutableStateOf(emptyList<String>()) }
              var results by remember { mutableStateOf(emptyList<VideoItem>()) }
              var loading by remember { mutableStateOf(false) }
              var searched by remember { mutableStateOf(false) }
              var pick by remember { mutableStateOf<VideoItem?>(null) }
              var recents by remember { mutableStateOf((prefs.getString("recent", "") ?: "").split("\n").filter { it.isNotBlank() }) }
              val jobs by Dl.jobs.collectAsState()

              // Detecta link do YouTube copiado ao abrir a aba / voltar pro app
              val owner = LocalLifecycleOwner.current
              DisposableEffect(owner) {
                  val o = LifecycleEventObserver { _, e ->
                      if (e == Lifecycle.Event.ON_RESUME) {
                          val t = ctx.getSystemService(ClipboardManager::class.java).primaryClip?.getItemAt(0)?.text?.toString()
                          clip = t?.takeIf { YtRepo.isYt(it) }?.let { YtRepo.extract(it) }
                      }
                  }
                  owner.lifecycle.addObserver(o); onDispose { owner.lifecycle.removeObserver(o) }
              }

              fun doSearch(text: String) = scope.launch {
                  val t = text.trim(); if (t.isEmpty()) return@launch
                  q = t; searched = true; sugg = emptyList(); loading = true
                  recents = (listOf(t) + recents.filter { it != t }).take(8)
                  prefs.edit().putString("recent", recents.joinToString("\n")).apply()
                  results = runCatching { YtRepo.search(t) }.getOrDefault(emptyList())
                  loading = false
              }
              LaunchedEffect(q, searched) { if (!searched && q.length >= 2) { delay(250); sugg = YtRepo.suggestions(q) } else sugg = emptyList() }

              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  // ── Colar link ──
                  OutlinedTextField(
                      link, { link = it; if (YtRepo.isYt(it)) linkUrl = YtRepo.extract(it) }, Modifier.fillMaxWidth(), singleLine = true,
                      label = { Text("Cole o link do YouTube") },
                      keyboardOptions = KeyboardOptions(imeAction = ImeAction.Go),
                      keyboardActions = KeyboardActions(onGo = { if (YtRepo.isYt(link)) linkUrl = YtRepo.extract(link) })
                  )
                  clip?.let { c ->
                      Spacer(Modifier.height(8.dp))
                      Card(Modifier.fillMaxWidth().clickable { linkUrl = c }, colors = CardDefaults.cardColors(containerColor = Color(0xFF0F2B28))) {
                          Column(Modifier.padding(12.dp)) {
                              Text("Link copiado detectado", color = Turq)
                              Text(c, maxLines = 1, overflow = TextOverflow.Ellipsis, color = Color.White)
                              Text("Toque para baixar", color = Color.Gray, style = MaterialTheme.typography.bodySmall)
                          }
                      }
                  }
                  Spacer(Modifier.height(10.dp))

                  // ── Pesquisar ──
                  OutlinedTextField(
                      q, { q = it; searched = false; results = emptyList() }, Modifier.fillMaxWidth(), singleLine = true, label = { Text("Pesquisar no YouTube") },
                      keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                      keyboardActions = KeyboardActions(onSearch = { doSearch(q) })
                  )
                  sugg.forEach { s -> Text(s, Modifier.fillMaxWidth().clickable { doSearch(s) }.padding(vertical = 10.dp)) }
                  if (loading) LinearProgressIndicator(Modifier.fillMaxWidth().padding(top = 8.dp), color = Turq)

                  if (results.isNotEmpty()) {
                      LazyColumn {
                          items(results) { v ->
                              Row(Modifier.fillMaxWidth().clickable { pick = v }.padding(vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Thumb(v.thumb)
                                  Spacer(Modifier.width(10.dp))
                                  Column {
                                      Text(v.title, maxLines = 2, overflow = TextOverflow.Ellipsis)
                                      Text("${v.channel} • ${v.seconds / 60}:${"%02d".format(v.seconds % 60)}", color = Color.Gray, style = MaterialTheme.typography.bodySmall)
                                  }
                              }
                          }
                      }
                  } else if (!loading && q.isBlank()) {
                      // ── Conteúdo da aba quando não há busca ──
                      Column(Modifier.verticalScroll(rememberScrollState()).padding(top = 8.dp)) {
                          Text("Sugestões para começar", color = Turq, style = MaterialTheme.typography.titleMedium)
                          Spacer(Modifier.height(8.dp))
                          TOPICS.chunked(2).forEach { row ->
                              Row(Modifier.fillMaxWidth().padding(bottom = 8.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  row.forEach { (label, query) ->
                                      Card(Modifier.weight(1f).clickable { doSearch(query) }, colors = CardDefaults.cardColors(containerColor = Color(0xFF111111))) {
                                          Text(label, Modifier.padding(14.dp))
                                      }
                                  }
                              }
                          }

                          if (recents.isNotEmpty()) {
                              Spacer(Modifier.height(8.dp))
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text("Pesquisas recentes", color = Turq, style = MaterialTheme.typography.titleMedium, modifier = Modifier.weight(1f))
                                  TextButton({ recents = emptyList(); prefs.edit().remove("recent").apply() }) { Text("Limpar", color = Color.Gray) }
                              }
                              recents.forEach { r -> Text("🕘  $r", Modifier.fillMaxWidth().clickable { doSearch(r) }.padding(vertical = 10.dp)) }
                          }

                          val active = jobs.filter { it.st != St.DONE }
                          if (active.isNotEmpty()) {
                              Spacer(Modifier.height(12.dp))
                              Text("Baixando agora", color = Turq, style = MaterialTheme.typography.titleMedium)
                              active.reversed().forEach { JobRow(it) }
                          }

                          Spacer(Modifier.height(12.dp))
                          Card(Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = Color(0xFF0F2B28))) {
                              Column(Modifier.padding(14.dp)) {
                                  Text("Dica", color = Turq)
                                  Text(
                                      "No YouTube, toque em Compartilhar e escolha Lindoso Download para baixar sem sair do app. " +
                                          "Baixe apenas conteúdo seu, Creative Commons ou autorizado.",
                                      color = Color.White, style = MaterialTheme.typography.bodySmall
                                  )
                              }
                          }
                      }
                  }
              }
              pick?.let { FormatDialog(it.url, it.title) { pick = null } }
              linkUrl?.let { FormatDialog(it, it) { linkUrl = null; link = "" } }
          }

          /** Miniatura carregada sem biblioteca externa (mantém o APK pequeno). */
          @Composable
          fun Thumb(url: String?) {
              val bmp by produceState<Bitmap?>(null, url) {
                  value = url?.let { u -> withContext(Dispatchers.IO) { runCatching { URL(u).openStream().use { BitmapFactory.decodeStream(it) } }.getOrNull() } }
              }
              Box(Modifier.size(width = 110.dp, height = 62.dp).background(Color(0xFF111111))) {
                  bmp?.let { androidx.compose.foundation.Image(it.asImageBitmap(), null, Modifier.fillMaxSize()) }
              }
          }

          // ───────────────────────── Biblioteca ─────────────────────────
          @Composable
          fun LibraryTab() {
              val ctx = LocalContext.current
              var files by remember { mutableStateOf(emptyList<LFile>()) }
              var tick by remember { mutableIntStateOf(0) }
              val done = Dl.jobs.collectAsState().value.count { it.st == St.DONE }
              LaunchedEffect(tick, done) { files = withContext(Dispatchers.IO) { Library.list(ctx) } }

              var playing by remember { mutableStateOf<LFile?>(null) }
              var renaming by remember { mutableStateOf<LFile?>(null) }
              var deleting by remember { mutableStateOf<LFile?>(null) }
              var moving by remember { mutableStateOf<LFile?>(null) }
              val mover = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("*/*")) { dest ->
                  val f = moving; moving = null
                  if (dest != null && f != null) { Library.moveTo(ctx, f, dest); tick++ }
              }

              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  Text("Pasta: Download/Lindoso Download", color = Color.Gray, style = MaterialTheme.typography.bodySmall)
                  if (files.isEmpty()) Text("Nada baixado ainda.", Modifier.padding(top = 24.dp), color = Color.Gray)
                  LazyColumn {
                      items(files, key = { it.uri.toString() }) { f ->
                          Column(Modifier.fillMaxWidth().padding(vertical = 8.dp)) {
                              Text(f.name, maxLines = 2, overflow = TextOverflow.Ellipsis)
                              Text("%.1f MB".format(f.size / 1_048_576.0), color = Color.Gray, style = MaterialTheme.typography.bodySmall)
                              Row {
                                  TextButton({ playing = f }) { Text("Abrir", color = Turq) }
                                  TextButton({ renaming = f }) { Text("Renomear", color = Turq) }
                                  TextButton({ moving = f; mover.launch(f.name) }) { Text("Mover", color = Turq) }
                                  TextButton({ deleting = f }) { Text("Excluir", color = Color(0xFFFF6B6B)) }
                              }
                          }
                      }
                  }
              }

              playing?.let { f ->
                  Dialog({ playing = null }) {
                      AndroidView({ c ->
                          VideoView(c).apply {
                              setMediaController(MediaController(c).also { it.setAnchorView(this) })
                              setVideoURI(f.uri); setOnPreparedListener { start() }
                          }
                      }, Modifier.fillMaxWidth().height(260.dp).background(Color.Black))
                  }
              }
              renaming?.let { f ->
                  var name by remember { mutableStateOf(f.name) }
                  AlertDialog(
                      onDismissRequest = { renaming = null }, containerColor = Color(0xFF111111), title = { Text("Renomear") },
                      text = { OutlinedTextField(name, { name = it }, singleLine = true) },
                      confirmButton = { TextButton({ Library.rename(ctx, f, name); renaming = null; tick++ }) { Text("Salvar", color = Turq) } },
                      dismissButton = { TextButton({ renaming = null }) { Text("Cancelar", color = Color.Gray) } }
                  )
              }
              deleting?.let { f ->
                  AlertDialog(
                      onDismissRequest = { deleting = null }, containerColor = Color(0xFF111111), title = { Text("Excluir arquivo?") },
                      text = { Text(f.name) },
                      confirmButton = { TextButton({ Library.delete(ctx, f); deleting = null; tick++ }) { Text("Excluir", color = Color(0xFFFF6B6B)) } },
                      dismissButton = { TextButton({ deleting = null }) { Text("Cancelar", color = Color.Gray) } }
                  )
              }
          }
          LINDOSO_EOF
          mkdir -p "$(dirname 'app/src/main/java/com/lindoso/download/YtRepo.kt')"
          cat > 'app/src/main/java/com/lindoso/download/YtRepo.kt' <<'LINDOSO_EOF'
          package com.lindoso.download

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.schabi.newpipe.extractor.NewPipe
          import org.schabi.newpipe.extractor.ServiceList
          import org.schabi.newpipe.extractor.localization.Localization
          import org.schabi.newpipe.extractor.playlist.PlaylistInfo
          import org.schabi.newpipe.extractor.search.SearchInfo
          import org.schabi.newpipe.extractor.services.youtube.linkHandler.YoutubeSearchQueryHandlerFactory
          import org.schabi.newpipe.extractor.stream.StreamInfoItem

          data class VideoItem(val url: String, val title: String, val channel: String, val thumb: String?, val seconds: Long)

          /** Tudo que fala com o YouTube. Só YouTube, sem login, sem API key. */
          object YtRepo {
              private val yt get() = ServiceList.YouTube
              private val ytRegex = Regex("""(https?://)?(www\.|m\.|music\.)?(youtube\.com|youtu\.be)/\S+""", RegexOption.IGNORE_CASE)
              private val listRegex = Regex("""[?&]list=([\w-]+)""")

              fun init() = NewPipe.init(HttpDownloader(), Localization("pt", "BR"))

              fun isYt(s: String) = ytRegex.containsMatchIn(s.trim())
              fun extract(s: String): String = ytRegex.find(s.trim())!!.value.let { if (it.startsWith("http")) it else "https://$it" }
              fun hasList(url: String) = listRegex.containsMatchIn(url)
              fun playlistUrl(url: String) = "https://www.youtube.com/playlist?list=" + listRegex.find(url)!!.groupValues[1]

              suspend fun suggestions(q: String): List<String> = withContext(Dispatchers.IO) {
                  runCatching { yt.suggestionExtractor.suggestionList(q).take(6) }.getOrDefault(emptyList())
              }

              suspend fun search(q: String): List<VideoItem> = withContext(Dispatchers.IO) {
                  val h = yt.searchQHFactory.fromQuery(q, listOf(YoutubeSearchQueryHandlerFactory.VIDEOS), "")
                  SearchInfo.getInfo(yt, h).relatedItems.filterIsInstance<StreamInfoItem>().map(::toItem)
              }

              suspend fun playlist(url: String): List<VideoItem> = withContext(Dispatchers.IO) {
                  val info = PlaylistInfo.getInfo(yt, url)
                  val out = info.relatedItems.toMutableList()
                  var page = info.nextPage
                  while (page != null && out.size < 300) {
                      val more = PlaylistInfo.getMoreItems(yt, url, page)
                      out += more.items
                      page = more.nextPage
                  }
                  out.map(::toItem)
              }

              private fun toItem(i: StreamInfoItem) =
                  VideoItem(i.url, i.name, i.uploaderName ?: "", i.thumbnails.firstOrNull()?.url, i.duration)
          }
          LINDOSO_EOF
