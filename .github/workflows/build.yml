                      Text("Downloads", color = Color.Gray, modifier = Modifier.padding(top = 8.dp))
                      LazyColumn(Modifier.heightIn(max = 150.dp)) { items(jobs.reversed(), key = { it.id }) { JobRow(it) } }
                  }
