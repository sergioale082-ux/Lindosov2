                      BackHandler { val w = Web.view; if (w != null && w.canGoBack()) w.goBack() else (ctx as? Activity)?.finish() }
                      AndroidView({ c -> Web.get(c) { webUrl = it } }, Modifier.fillMaxSize())
                  }
                  if (isVideoUrl(webUrl)) {
                      Button(
                          { dialogUrl = webUrl }, Modifier.fillMaxWidth().padding(top = 8.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = Turq, contentColor = Color.Black)
                      ) { Text("Baixar este vídeo") }
