                  text = {
                      FormatPicker(title, YtRepo.hasList(url), busy) { h, whole ->
                          scope.launch { busy = true; startDownload(url, title, whole, h); onDone() }
                      }
                  },
                  confirmButton = {}, dismissButton = { TextButton(onDone) { Text("Cancelar", color = Color.Gray) } }
              )
          }

