name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto do lindoso.zip
        run: |
          mkdir projeto
          unzip -o lindoso.zip -d projeto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK
        working-directory: projeto
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LindosoDownload-apk
          path: projeto/app/build/outputs/apk/debug/*.apk
