          @Composable
          fun JobRow(j: DlState) {
              Column(Modifier.fillMaxWidth().padding(vertical = 8.dp)) {
                  Text(j.title, maxLines = 2, overflow = TextOverflow.Ellipsis)
                  LinearProgressIndicator(progress = { j.progress }, Modifier.fillMaxWidth().padding(vertical = 4.dp), color = Turq, trackColor = Color(0xFF222222))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Text(
                          when (j.st) {
                              St.QUEUED -> "Na fila"; St.RUNNING -> "${(j.progress * 100).toInt()}%"; St.PAUSED -> "Pausado"
                              St.WAITING -> j.msg; St.DONE -> "Concluído ✓"; St.ERROR -> "Erro: ${j.msg}"
                          }, color = Color.Gray, modifier = Modifier.weight(1f), style = MaterialTheme.typography.bodySmall
                      )
                      when (j.st) {
                          St.RUNNING, St.WAITING, St.QUEUED -> TextButton({ Dl.pause(j.id) }) { Text("Pausar", color = Turq) }
                          St.PAUSED, St.ERROR -> TextButton({ Dl.resume(j.id) }) { Text("Retomar", color = Turq) }
                          else -> {}
                      }
                  }
              }
          }

